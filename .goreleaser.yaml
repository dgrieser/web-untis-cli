# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: webuntis

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: webuntis
    main: ./cmd/webuntis
    binary: webuntis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/dgrieser/web-untis-cli/internal/cli.Version={{ .Version }}
    targets:
      - linux_amd64_v1   # x86-64 (PC/Server)
      - linux_arm64      # current ARM (Raspberry Pi 4/5 64-bit, ARM servers)
      - linux_arm_7      # ARMv7 (Raspberry Pi 2/3 32-bit)
      - darwin_arm64     # macOS Apple Silicon

archives:
  - id: webuntis
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: dgrieser
    name: web-untis-cli
  draft: false
  prerelease: auto
